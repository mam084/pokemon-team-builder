name: Fetch replays

# Daily: new public Showdown replays for Champions, parsed into compact records
# (data/replays/<format>/<day>.jsonl.gz). Run by hand with "backfill" to fetch
# older replays; each run stops before its time budget and resumes next time.
on:
  schedule:
    - cron: "17 9 * * *"
    - cron: "17 21 * * *"  # twice a day: GitHub sometimes skips a scheduled run
  workflow_dispatch:
    inputs:
      mode:
        description: "new or backfill"
        default: "new"
      minutes:
        description: "time budget"
        default: "50"
      samples:
        description: "raw logs to save per format (parser tests)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: fetch-replays-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch
        run: |
          MODE="${{ github.event.inputs.mode || 'new' }}"
          FLAG=""; [ "$MODE" = "backfill" ] && FLAG="--backfill"
          MIN="${{ github.event.inputs.minutes || '50' }}"; SAMPLES="${{ github.event.inputs.samples || '0' }}"
          if [ -n "$FLAG" ]; then  # a backfill also catches up on new replays first, so no gap opens
            python scripts/fetch_replays.py --minutes 20
            MIN=$((MIN - 20))
          fi
          python scripts/fetch_replays.py $FLAG --minutes "$MIN" --samples "$SAMPLES"
      - name: Summarize per-Pokémon replay stats for the app
        run: python scripts/summarize_replays.py
      - name: Retrain the learned teammate model on the new replays
        run: |
          pip install -r requirements.txt
          python scripts/train_teammates.py
        timeout-minutes: 20
        continue-on-error: true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/replays/ data/evaluation/regmc_teammates.json
          git diff --cached --quiet && exit 0
          git commit -m "Replays: ${{ github.event.inputs.mode || 'new' }} ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 10; done
