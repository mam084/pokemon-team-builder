name: Refresh data

# Rebuilds the legal-Pokemon dex from Pokemon Showdown's Champions mod, pulls
# the newest Smogon usage stats and tournament team lists (Limitless), then
# commits whatever changed.
#
# - monthly, a few days after Smogon publishes the previous month's stats
# - on demand (Actions tab -> Refresh data -> Run workflow)
# - whenever the data scripts themselves change, so the data always matches them

on:
  schedule:
    - cron: "17 9 3 * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "!scripts/*_lab*.py"           # experiments: they don't change the data
      - "!scripts/app_vs_results.py"
      - "!scripts/replay_matches.py"
      - "src/formats.py"
      - "src/usage.py"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build Pokemon Showdown
        run: |
          git clone --depth 1 https://github.com/smogon/pokemon-showdown.git ../pokemon-showdown
          cd ../pokemon-showdown
          npm ci
          node build

      - name: Export legal dex
        run: node scripts/export_dex.js --ps ../pokemon-showdown --out data/dex

      - name: Fetch Smogon usage stats
        run: |
          pip install -r requirements.txt
          python scripts/fetch_usage.py

      - name: Fetch tournament team lists (Limitless)
        run: python scripts/fetch_tournaments.py
        timeout-minutes: 30
        continue-on-error: true  # evaluation data only; never block a usage refresh

      - name: Retrain the learned teammate model (synergy)
        run: python scripts/train_teammates.py
        timeout-minutes: 20
        continue-on-error: true

      - name: Check which Mega formes have Showdown sprites
        run: python scripts/check_sprites.py
        continue-on-error: true

      - name: Re-run the recommender evaluation on the new data
        run: python scripts/evaluate.py
        timeout-minutes: 45
        continue-on-error: true

      - name: Check the matchup score against real match results
        run: python -m src.validate
        timeout-minutes: 30
        continue-on-error: true

      - name: Retrain the learned match model
        run: |
          pip install scikit-learn
          python -m src.match_model
        timeout-minutes: 40
        continue-on-error: true

      - name: Rebuild the team rating reference (auto-builder ranking)
        run: python -m src.team_rating
        timeout-minutes: 15
        continue-on-error: true

      - name: Held-out team check (ranking real teams, and the swap search with trust bounds)
        run: python -m src.team_check
        timeout-minutes: 30
        continue-on-error: true

      - name: Retrain the bring / lead model on replays
        run: python -m src.bring_model
        timeout-minutes: 60
        continue-on-error: true

      - name: Update the README's result tables
        run: python scripts/update_readme.py
        continue-on-error: true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          if git diff --cached --quiet; then
            echo "Data already up to date."; exit 0
          fi
          git commit -m "Refresh Champions dex and usage data"
          # This run takes ~30 min, so a code push or a replay fetch often lands meanwhile. Rebase
          # onto it, keeping this run's regenerated files on a conflict; fail loudly if it still can't push.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then :; else
              while git diff --name-only --diff-filter=U | grep -q .; do
                git diff --name-only --diff-filter=U | xargs -r git checkout --theirs --
                git add -A data/ README.md
                GIT_EDITOR=true git rebase --continue || true
              done
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 15
          done
          echo "::error::Could not push the refreshed data after 5 tries"; exit 1
